<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中学英文法 正誤判定クイズ</title>
<style>
:root{color-scheme:light;--fg:#222;--mut:#6b7280;--line:#e5e7eb;--acc:#1f6f5c;--ok:#1f7a45;--ng:#d64545;--okb:#e8f6ee;--ngb:#fdecea;--amb:#f5a524;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--fg);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.35;pointer-events:none;z-index:0;animation:fl 9s ease-in-out infinite alternate}
.b1{width:240px;height:240px;background:#bfe9dc;top:-70px;right:-60px}.b2{width:200px;height:200px;background:#cfe4ff;bottom:-60px;left:-50px;animation-delay:-4s}
@keyframes fl{to{transform:translate(-24px,28px) scale(1.12)}}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.45rem;margin:.2em 0 .1em}h1 span{display:inline-block;animation:bn 1.8s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-5px) rotate(-8deg)}}
.lead{color:var(--mut);margin:0 0 16px;font-size:.92rem}
.scr{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{padding:7px 13px;border:1.5px solid var(--line);border-radius:99px;background:#fff;color:var(--fg);font:inherit;font-size:.9rem;cursor:pointer;transition:transform .15s,background .2s,color .2s,border-color .2s;animation:pop .45s both}
.chip:hover{transform:translateY(-2px)}.chip:active{transform:scale(.93)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.04)}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
.cnt{font-size:.9rem;color:var(--mut);margin:0 0 14px}.cnt b{color:var(--acc);font-size:1.1rem}
.btn{padding:13px 22px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #14473b;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #14473b}
.btn.sub{background:#fff;color:var(--acc);border:1.5px solid var(--acc);box-shadow:0 4px 0 #bcd9d0}
.go{animation:pl 2s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.04)}}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;box-shadow:0 8px 24px rgba(31,111,92,.08)}
.slide{animation:sl .45s cubic-bezier(.2,.8,.2,1)}@keyframes sl{from{opacity:0;transform:translateX(40px)}}
.shake{animation:sk .45s}@keyframes sk{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--mut);margin:0 0 8px}
.bar{height:8px;background:#eef0f2;border-radius:6px;margin:0 0 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fa58a,#1f6f5c);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.combo{display:inline-block;color:#fff;background:linear-gradient(90deg,#ff9f43,#ff6b6b);padding:1px 10px;border-radius:99px;font-weight:700;font-size:.8rem}
.pop{animation:cp .5s cubic-bezier(.3,1.8,.5,1)}@keyframes cp{from{transform:scale(.3);opacity:0}}
.bump{animation:bp .4s}@keyframes bp{40%{transform:scale(1.4);color:var(--acc)}}
.tag{display:inline-block;font-size:.78rem;color:var(--acc);background:var(--okb);padding:1px 9px;border-radius:99px}
.q{font-size:1.4rem;font-weight:700;margin:10px 0 20px;line-height:1.55;min-height:3.1em}
.q span{display:inline-block;margin-right:.3em;animation:wd .4s both}@keyframes wd{from{opacity:0;transform:translateY(10px)}}
.ans{display:flex;gap:12px}
.ans button{flex:1;padding:15px;font:inherit;font-size:1.15rem;font-weight:800;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.ans button:hover:not(:disabled){transform:translateY(-3px);border-color:var(--acc)}.ans button:active:not(:disabled){transform:scale(.95)}
.ans button:disabled{cursor:default}.ans .dim{opacity:.4}
.ans .good{border-color:var(--ok);background:var(--okb);animation:cp .4s}.ans .bad{border-color:var(--ng);background:var(--ngb)}
.keys{font-size:.75rem;color:var(--mut);text-align:center;margin:8px 0 0}
.fb{margin-top:16px;padding:12px 14px;border-radius:12px;animation:dr .4s cubic-bezier(.2,.8,.2,1)}@keyframes dr{from{opacity:0;transform:translateY(-10px)}}
.fb.ok{background:var(--okb)}.fb.ng{background:var(--ngb)}.fb p{margin:6px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ringw{text-align:center}
.ring{width:150px;height:150px}.rb{fill:none;stroke:#eef0f2;stroke-width:10}
.rf{fill:none;stroke:var(--acc);stroke-width:10;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring text{font-size:26px;font-weight:800;fill:var(--acc)}
.msg{font-size:1.2rem;font-weight:800;margin:4px 0 12px;text-align:center}
.stats{display:flex;gap:10px;margin:0 0 6px}.stats div{flex:1;text-align:center;background:#f7f9f8;border-radius:12px;padding:8px 4px;font-size:.78rem;color:var(--mut)}.stats b{display:block;font-size:1.4rem;color:var(--fg)}
h2{font-size:1.05rem;margin:22px 0 10px;padding-left:10px;border-left:5px solid var(--ng)}
.m{border:1px solid var(--line);border-left:5px solid var(--ng);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:#fff;animation:up .5s both}
.m.g{border-left-color:var(--ok)}
.mh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;margin:0 0 8px}
.n{background:var(--ng);color:#fff;border-radius:99px;padding:0 9px;font-weight:700}
.you{color:var(--ng);background:var(--ngb);padding:1px 9px;border-radius:99px}
.lb{font-size:.75rem;color:var(--mut);margin:6px 0 2px}
.s{font-size:1.1rem;font-weight:600}
.s .r{color:var(--ng);background:var(--ngb);border-radius:4px;padding:0 3px;font-weight:800}
.s .g{color:var(--ok);background:var(--okb);border-radius:4px;padding:0 3px;font-weight:800}
.rule{margin:10px 0 0;padding:8px 10px;background:#fffbea;border-radius:8px;font-size:.88rem}
.cf{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:50}
.hero{position:relative;overflow:hidden;text-align:center;padding:30px 16px 22px;border-radius:26px;background:linear-gradient(135deg,#e6f7f0 0%,#eef4ff 55%,#fdf1f6 100%);border:1px solid #e3efe9;box-shadow:0 12px 32px rgba(31,111,92,.1);margin:6px 0 4px}
.fl{position:absolute;font-weight:800;font-size:3.4rem;color:var(--acc);opacity:.14;animation:fl2 5s ease-in-out infinite alternate;pointer-events:none}
.f1{left:6%;top:8%}.f2{right:8%;top:6%;animation-delay:-1.5s;color:#5b9cff}.f3{left:12%;bottom:6%;animation-delay:-3s;color:#ff6b6b}.f4{right:10%;bottom:10%;animation-delay:-2s;color:#f5a524}
@keyframes fl2{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-14px) rotate(10deg)}}
.eyebrow{margin:0;font-size:.7rem;letter-spacing:.22em;color:var(--acc);font-weight:700}
.ttl{font-size:2.5rem;font-weight:900;line-height:1.2;margin:8px 0 4px;letter-spacing:.02em}
.ttl span{display:inline-block;margin:0 .08em;background:linear-gradient(90deg,#1f6f5c,#5b9cff,#ff6b6b);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gr 4s linear infinite,bn 2s ease-in-out infinite}
@keyframes gr{to{background-position:200% 0}}
.sub{margin:0 0 16px;color:var(--mut);font-size:.95rem}
.facts{display:flex;justify-content:center;gap:10px}
.facts div{min-width:74px;padding:8px 10px;background:rgba(255,255,255,.75);border-radius:14px;font-size:.72rem;color:var(--mut);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.facts b{display:block;font-size:1.35rem;color:var(--acc)}
.sec{font-weight:800;margin:24px 2px 10px;font-size:.98rem}.sec small{font-weight:400;color:var(--mut);font-size:.78rem}
#chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin:0}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:16px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tile i{font-style:normal;font-size:1.3rem;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#f1f5f4;margin-bottom:4px}
.tile span{font-weight:700;font-size:.9rem;line-height:1.35}.tile em{font-style:normal;font-size:.72rem;color:var(--mut)}
.tile.on{background:#effaf5;border-color:var(--acc);color:var(--fg);transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,111,92,.18)}
.tile.on i{background:var(--acc)}.tile.on::after{content:"✓";position:absolute;right:10px;top:8px;color:var(--acc);font-weight:900;animation:pop .3s both}
#nums,#grades{--c:4}
#modes,#nums,#grades{display:grid;grid-template-columns:repeat(var(--c,2),1fr);gap:4px;background:#f1f4f3;border-radius:16px;padding:4px;margin:0}
#modes .chip,#nums .chip,#grades .chip{border:0;border-radius:12px;background:transparent;padding:11px 6px;font-weight:700;text-align:center;animation:none}
#modes .chip.on,#nums .chip.on,#grades .chip.on{background:#fff;color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.12);transform:none}
.big{width:100%;margin-top:22px;padding:17px;font-size:1.2rem;border-radius:18px;background:linear-gradient(135deg,#2fa58a,#1f6f5c)}
.big small{font-weight:500;opacity:.9;margin-left:8px;font-size:.85rem}.big small b{font-size:1rem}
.tile.off{opacity:.35}.btn:disabled{opacity:.45;cursor:not-allowed;animation:none;box-shadow:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
<h1 id="mini" hidden><span>✏️</span> 中学英文法 正誤判定クイズ</h1>

<div id="start" class="scr">
<div class="hero"><div class="fl f1">A</div><div class="fl f2">?</div><div class="fl f3">〇</div><div class="fl f4">×</div><p class="eyebrow">JUNIOR HIGH ENGLISH GRAMMAR</p><div class="ttl">英文法<span>〇×</span>クイズ</div><p class="sub">正しい？ まちがい？ 一瞬で見ぬけ！</p><div class="facts"><div><b id="fq">0</b>問題</div><div><b id="fp">0</b>パターン</div><div><b id="fc">0</b>分類</div></div></div>
<p class="sec">① 学年をえらぶ <small>（教科書により前後します）</small></p>
<div class="chips" id="grades"><button class="chip on" data-g="0">全学年</button><button class="chip" data-g="1">中1</button><button class="chip" data-g="2">中2</button><button class="chip" data-g="3">中3</button></div>
<p class="sec">② 分類をえらぶ <small>（未選択ならすべて）</small></p>
<div class="chips" id="chips"></div>
<p class="sec">③ 出題モード <small>（パターン別＝誤りの型ごとに1問ずつ）</small></p>
<div class="chips" id="modes"><button class="chip" data-m="p">🧩 パターン別（各1問）</button><button class="chip on" data-m="a">🎲 ランダム出題</button></div>
<p class="sec">④ 問題数 <small>（おすすめは10問）</small></p>
<div class="chips" id="nums"><button class="chip on" data-n="10">10問</button><button class="chip" data-n="20">20問</button><button class="chip" data-n="30">30問</button><button class="chip" data-n="0">全問</button></div>
<button class="btn go big" id="go">スタート ▶ <small>全 <b id="cnt">0</b> 問</small></button>
</div>

<div id="play" hidden>
<div class="card" id="card">
<div class="hud"><span id="no"></span><span><span class="combo" id="combo" hidden></span> 正解 <b id="sc">0</b></span></div>
<div class="bar"><i id="bar"></i></div>
<span class="tag" id="cat"></span>
<p class="q" id="q"></p>
<div class="ans"><button id="yes">〇 正しい</button><button id="no2">× 誤り</button></div>
<p class="keys">キー操作：← 〇 ／ × →　Enter で次へ</p>
<div class="fb" id="fb" hidden></div>
<div class="row"><button class="btn" id="next" hidden>次へ</button></div>
</div>
</div>

<div id="end" hidden>
<div class="card">
<div class="ringw"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="rb"/><circle cx="60" cy="60" r="52" class="rf" id="rf"/><text x="60" y="68" text-anchor="middle" id="rt">0%</text></svg></div>
<p class="msg" id="msg"></p>
<div class="stats"><div><b id="s1">0</b>正解</div><div><b id="s2">0</b>不正解</div><div><b id="s3">0</b>最高連続</div></div>
<div class="row"><button class="btn" id="again" hidden>まちがえた問題だけ再挑戦</button><button class="btn sub" id="back">分類を選びなおす</button></div>
</div>
<h2 id="mh" hidden>まちがえた問題</h2>
<div id="miss"></div>
</div>
</main>
<script>
const CATS=["文の基本","時制","助動詞","疑問文","不定詞・動名詞","比較","受け身","接続詞・関係代名詞","仮定法・その他","前置詞","難問","文型","It構文","分詞・関係詞","接続詞構文","完了の応用","比較構文"];
// P：[分類, 解説, [[正しい文, 誤りの文], …]]（各組から〇・×の2問を作る）
const P=[
[0,"三単現：主語が三人称単数の現在形では、動詞に s を付ける。",[["He plays tennis.","He play tennis."],["My sister likes music.","My sister like music."]]],
[0,"does / doesn’t のあとの動詞は原形（s は付けない）。",[["She doesn’t play tennis.","She doesn’t plays tennis."],["Does he eat breakfast?","Does he eats breakfast?"]]],
[0,"be動詞と一般動詞は並べて使わない。一般動詞の疑問文は Do / Does を使う。",[["Do you like dogs?","Are you like dogs?"],["Does she play the piano?","Is she play the piano?"]]],
[0,"There is ＋ 単数 / There are ＋ 複数。",[["There is a book on the desk.","There are a book on the desk."],["There are two cats in the room.","There is two cats in the room."]]],
[0,"命令文は動詞の原形で始める。否定は Don’t ～、be動詞は Be ～。",[["Don’t open the door.","Not open the door."],["Be quiet.","Are quiet."]]],
[1,"did / didn’t のあとの動詞は原形。",[["I didn’t play tennis yesterday.","I didn’t played tennis yesterday."],["Did you go to Kyoto last week?","Did you went to Kyoto last week?"]]],
[1,"yesterday / last ～ など過去を表す語があるときは過去形にする。",[["I played tennis yesterday.","I play tennis yesterday."],["We watched TV last night.","We watch TV last night."]]],
[1,"現在進行形は be動詞 ＋ 動詞のing形。",[["I am playing tennis now.","I am play tennis now."],["She is reading a book.","She reading a book."]]],
[1,"be動詞の過去形は、I / he / she / it は was、you / we / they は were。",[["I was busy yesterday.","I were busy yesterday."],["They were at home.","They was at home."]]],
[1,"yesterday など過去の一点を表す語は現在完了と使えず、過去形にする。",[["I visited Kyoto yesterday.","I have visited Kyoto yesterday."],["I saw him last week.","I have seen him last week."]]],
[1,"現在完了は have / has ＋ 過去分詞。",[["I have lived here for three years.","I have live here for three years."],["She has finished her homework.","She has finish her homework."]]],
[1,"現在完了の have は主語が he / she / it のとき has にする。",[["He has been to Kyoto.","He have been to Kyoto."],["We have just finished.","We has just finished."]]],
[1,"will のあとは原形。be going to のあとも原形（to を忘れない）。",[["I will go to the park.","I will goes to the park."],["I am going to visit Kyoto.","I am going visit Kyoto."]]],
[2,"助動詞のあとは、主語に関係なく原形。",[["She can swim.","She can swims."],["Ken can play the piano.","Ken can plays the piano."]]],
[2,"助動詞のあとに to は入れない。",[["Will you help me?","Will you to help me?"],["I can speak English.","I can to speak English."]]],
[2,"must の否定は must not（禁止）。don’t は使わない。",[["You must not go.","You don’t must go."],["You must not run here.","You don’t must run here."]]],
[2,"have to は主語が三人称単数なら has to。否定は don’t / doesn’t have to。",[["She has to study.","She have to study."],["I don’t have to go.","I don’t has to go."]]],
[2,"助動詞の否定・疑問は助動詞そのものを使い、do / does は使わない。",[["Can you swim?","Do you can swim?"],["He can’t swim.","He doesn’t can swim."]]],
[3,"疑問詞のあとは疑問文の語順（do / does ＋ 主語 ＋ 動詞）にする。",[["Where do you live?","Where you live?"],["What do you want?","What you want?"]]],
[3,"間接疑問文は疑問詞 ＋ 主語 ＋ 動詞の語順。do / does は使わない。",[["I know what he wants.","I know what does he want."],["I don’t know where she lives.","I don’t know where does she live."]]],
[3,"疑問詞が主語のときは語順が変わらず、動詞に s が付く。",[["Who plays tennis?","Who play tennis?"],["Who likes music?","Who like music?"]]],
[3,"数は How many ＋ 複数名詞、量・値段は How much。",[["How many books do you have?","How many book do you have?"],["How much is this?","How many is this?"]]],
[3,"付加疑問文は、前の文の動詞に合わせて否定・肯定を逆にして付ける。",[["You are a student, aren’t you?","You are a student, don’t you?"],["He plays tennis, doesn’t he?","He plays tennis, isn’t he?"]]],
[4,"want のあとは不定詞（to ＋ 原形）。",[["I want to play tennis.","I want playing tennis."],["She wants to go home.","She wants going home."]]],
[4,"enjoy / finish のあとは動名詞（ing形）。",[["I enjoy playing tennis.","I enjoy to play tennis."],["He finished reading the book.","He finished to read the book."]]],
[4,"want / ask ＋ 人 ＋ to ～ で「人に～してほしい・頼む」。",[["I want you to come.","I want you come."],["He asked me to help him.","He asked me help him."]]],
[4,"疑問詞 ＋ to ～、too ～ to … では to を忘れない。",[["I know how to swim.","I know how swim."],["I am too tired to walk.","I am too tired walk."]]],
[5,"短い語は -er ＋ than、長い語は more ＋ 原級 ＋ than。",[["He is taller than I.","He is more tall than I."],["This book is more interesting than that one.","This book is interestinger than that one."]]],
[5,"good / well は better – best と不規則に変化する。",[["This is better than that.","This is more good than that."],["She is the best singer.","She is the goodest singer."]]],
[5,"最上級の範囲は、集まりなら in、複数を表す語なら of。",[["He is the tallest in my class.","He is the tallest of my class."],["She is the oldest of the three.","She is the oldest in the three."]]],
[5,"同等比較は as ＋ 原級 ＋ as（比較級にしない）。",[["He is as tall as I.","He is as taller as I."],["She is not as old as Ken.","She is not as older as Ken."]]],
[6,"受け身は be動詞 ＋ 過去分詞（過去形ではない）。",[["The window was broken by him.","The window was broke by him."],["This cake was made by my mother.","This cake was make by my mother."]]],
[6,"受け身の文には be動詞が必要。「～される」は be ＋ 過去分詞。",[["English is spoken in Canada.","English speaks in Canada."],["Is English spoken here?","Does English spoken here?"]]],
[6,"受け身の否定・疑問は be動詞を使う（do / did は使わない）。",[["The door was not opened.","The door didn’t opened."],["Was the window broken?","Did the window broken?"]]],
[7,"人を説明する関係代名詞は who、物は which / that。",[["The man who lives next door is kind.","The man which lives next door is kind."],["This is the book that I bought.","This is the book who I bought."]]],
[7,"if / when の中は、未来のことでも現在形にする。",[["If it rains, I will stay home.","If it will rain, I will stay home."],["When I get home, I will call you.","When I will get home, I will call you."]]],
[7,"because のあとは「主語 ＋ 動詞」。名詞が続くときは because of。",[["I was tired because I ran.","I was tired because of I ran."],["I stayed home because it rained.","I stayed home because of it rained."]]],
[8,"仮定法では、I のあとでも were を使う。",[["If I were a bird, I would fly.","If I was a bird, I would fly."],["I wish I were a bird.","I wish I am a bird."]]],
[8,"感嘆文は What a ＋ 名詞 / How ＋ 形容詞。",[["What a nice dog!","How a nice dog!"],["How cute!","What cute!"]]]
];

const $=id=>document.getElementById(id);
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let sel=new Set(),mode="a",N=10,G=0,list=[],i=0,right=0,streak=0,best=0,miss=[],done=false;
const ex=p=>p[2].flatMap(([c,w])=>[[p[0],c,1,c,p[1],p.g],[p[0],w,0,c,p[1],p.g]]);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}return a};
const pool=()=>{const lists=shuffle(P.filter(p=>(G===0||p.g===G)&&(sel.size===0||sel.has(p[0])))).map(p=>shuffle(ex(p))),used=new Set(),out=[];for(let r=0;r<(mode==="p"?1:9);r++)lists.forEach(l=>{const q=l.find(x=>!used.has(x[3]));if(q){used.add(q[3]);out.push(q)}});return N?out.slice(0,N):out};
const count=()=>{const n=pool().length;$("cnt").textContent=n;$("go").disabled=n===0;document.querySelectorAll("#chips .tile").forEach((t,k)=>{const m=P.filter(p=>p[0]===k&&(G===0||p.g===G)).length;t.children[2].textContent=m+"パターン";t.classList.toggle("off",m===0)})};
function replay(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function show(id){["start","play","end"].forEach(x=>$(x).hidden=x!==id);$("mini").hidden=id==="start";const e=$(id);if(id!=="play")replay(e,"scr");window.scrollTo(0,0)}
function burst(x,y,n){if(RM)return;const cols=["#2fa58a","#f5a524","#ff6b6b","#5b9cff","#b57bee"];for(let k=0;k<n;k++){const e=document.createElement("i");e.className="cf";e.style.cssText="left:"+x+"px;top:"+y+"px;background:"+cols[k%5];document.body.appendChild(e);const a=Math.random()*6.28,d=60+Math.random()*130;e.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d+70)+"px) rotate("+Math.random()*540+"deg) scale(.6)",opacity:0}],{duration:700+Math.random()*600,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>e.remove()}}
const ICONS=["🧩","⏰","🔑","❓","🎯","⚖️","🔁","🔗","✨","📍","🔥","🧱","👆","🔧","🔀","⏳","📏"];
CATS.forEach((c,k)=>{const b=document.createElement("button");b.className="chip tile";b.innerHTML="<i>"+ICONS[k]+"</i><span></span><em></em>";b.children[1].textContent=c;b.children[2].textContent=P.filter(p=>p[0]===k).length+"パターン";b.style.animationDelay=k*50+"ms";b.onclick=()=>{sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle("on");count()};$("chips").appendChild(b)});

function begin(pl){list=shuffle(pl.slice());i=0;right=0;streak=0;best=0;miss=[];$("sc").textContent=0;show("play");render()}
function render(){
const q=list[i];done=false;replay($("card"),"slide");
$("no").textContent="第 "+(i+1)+" 問 / "+list.length+" 問";
$("bar").style.width=(i/list.length*100)+"%";
$("cat").textContent="中"+q[5]+"｜"+CATS[q[0]];
const qe=$("q");qe.innerHTML="";q[1].split(" ").forEach((w,k)=>{const s=document.createElement("span");s.textContent=w;s.style.animationDelay=k*60+"ms";qe.appendChild(s)});

["yes","no2"].forEach(x=>{const b=$(x);b.disabled=false;b.className=""});
}
function answer(v){
if(done)return;done=true;
const q=list[i],ok=(v===q[2]),pb=$(v?"yes":"no2"),ob=$(v?"no2":"yes");

const r=pb.getBoundingClientRect();
if(ok){right++;streak++;best=Math.max(best,streak);burst(r.left+r.width/2,r.top+r.height/2,streak>=3?36:18);replay($("sc"),"bump")}
else{streak=0;miss.push({q:q,v:v});replay($("card"),"shake");try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
$("sc").textContent=right;
const cb=$("combo");if(streak>=2){cb.hidden=false;cb.textContent="🔥 "+streak+"連続";replay(cb,"pop")}else cb.hidden=true;
const fb=$("fb");fb.className="fb "+(ok?"ok":"ng");fb.hidden=false;fb.innerHTML="";
const t=document.createElement("b");t.textContent=ok?"〇 正解です！":"× 不正解";fb.appendChild(t);
const p1=document.createElement("p");p1.textContent=q[2]?"この文は正しい文です。":"正しくは：「"+q[3]+"」";fb.appendChild(p1);
const p2=document.createElement("p");p2.textContent="💡 "+q[4];fb.appendChild(p2);

$("next").textContent=(i+1<list.length)?"次へ ▶":"結果を見る ▶";$("next").hidden=false;
}
const norm=w=>w.replace(/[.,?!]/g,"").toLowerCase();

show("end");const n=list.length,pct=Math.round(right/n*100);
